<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#060a12" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#cyber-grad)" stroke-width="3" stroke-dasharray="160 40" filter="url(#glow)"/>
  <text x="50" y="58" font-family="sans-serif" font-weight="800" font-size="28" fill="#00f0ff" text-anchor="middle" letter-spacing="-1">P</text>
  <circle cx="70" cy="30" r="4" fill="#00f0ff" filter="url(#glow)" />
</svg>
