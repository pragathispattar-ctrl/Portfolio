    <!-- Immediate Theme Sync to default to light mode -->
    <script>
      (function() {
        var storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#030712] text-slate-900 dark:text-slate-100 antialiased selection:bg-cyan-500/25 selection:text-cyan-900 dark:selection:text-cyan-200 overflow-x-hidden min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
